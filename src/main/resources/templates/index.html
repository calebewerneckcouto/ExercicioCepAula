<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS - Buscador de Endereços e Rotas</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
        }

        header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .subtitle {
            opacity: 0.8;
            font-size: 14px;
        }

        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 400px;
            background: #f8f9fa;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }

        .tabs {
            display: flex;
            background: #34495e;
        }

        .tab-button {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .tab-button:hover {
            background: #415a77;
        }

        .tab-button.active {
            background: #4CAF50;
            font-weight: bold;
        }

        .tab-content {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
            font-size: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            border-color: #4CAF50;
            outline: none;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .row .form-group {
            flex: 1;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 5px;
        }

        button:hover {
            background: #45a049;
        }

        #resultado {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            background: #f8f9fa;
            border-left: 4px solid #4CAF50;
        }

        .erro {
            border-left-color: #e74c3c !important;
            background: #ffe6e6 !important;
            color: #c0392b;
        }

        .endereco-completo {
            font-size: 16px;
            font-weight: bold;
            color: #2c3e50;
            margin: 10px 0;
            padding: 12px;
            background: #e8f5e8;
            border-radius: 6px;
            border-left: 4px solid #27ae60;
        }

        .endereco-item {
            margin-bottom: 8px;
            padding: 8px 0;
            border-bottom: 1px solid #ecf0f1;
            font-size: 14px;
        }

        .endereco-item:last-child {
            border-bottom: none;
        }

        .hidden {
            display: none;
        }

        .exemplo {
            font-size: 11px;
            color: #7f8c8d;
            margin-top: 4px;
        }

        .loading {
            text-align: center;
            padding: 15px;
            color: #7f8c8d;
        }

        .copy-btn {
            background: #3498db;
            margin-top: 8px;
            padding: 8px;
            font-size: 12px;
        }

        .copy-btn:hover {
            background: #2980b9;
        }

        .map-container {
            flex: 1;
            position: relative;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        .route-controls {
            padding: 15px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }

        .route-info {
            margin-top: 15px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 4px solid #3498db;
        }

        .route-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .route-item strong {
            color: #2c3e50;
        }

        .clear-btn {
            background: #e74c3c;
        }

        .clear-btn:hover {
            background: #c0392b;
        }

        .route-btn {
            background: #3498db;
        }

        .route-btn:hover {
            background: #2980b9;
        }

        .marker-info {
            font-size: 14px;
            padding: 5px;
        }

        .marker-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .coordinates {
            font-size: 12px;
            color: #7f8c8d;
        }

        .search-results {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            margin-top: 10px;
        }

        .search-result-item {
            padding: 10px;
            border-bottom: 1px solid #e0e0e0;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-result-item:hover {
            background: #f0f0f0;
        }

        .search-result-item:last-child {
            border-bottom: none;
        }

        .search-result-title {
            font-weight: bold;
            font-size: 14px;
        }

        .search-result-details {
            font-size: 12px;
            color: #7f8c8d;
        }

        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                max-height: 40vh;
            }
            
            .map-container {
                height: 60vh;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🗺️ Sistema GPS - Buscador de Endereços e Rotas</h1>
            <p class="subtitle">Encontre endereços por CEP, calcule rotas e visualize no mapa</p>
        </header>

        <div class="main-content">
            <div class="sidebar">
                <div class="tabs">
                    <button class="tab-button active" onclick="openTab('tabCep')">Buscar por CEP</button>
                    <button class="tab-button" onclick="openTab('tabEndereco')">Buscar por Endereço</button>
                    <button class="tab-button" onclick="openTab('tabRota')">Calcular Rota</button>
                </div>

                <!-- TAB 1: Busca por CEP -->
                <div id="tabCep" class="tab-content">
                    <div class="row">
                        <div class="form-group">
                            <label for="cep">CEP:</label>
                            <input type="text" id="cep" placeholder="00000-000" maxlength="9">
                            <div class="exemplo">Exemplo: 33234-166</div>
                        </div>
                        
                        <div class="form-group">
                            <label for="numero">Número:</label>
                            <input type="text" id="numero" placeholder="Número da casa">
                            <div class="exemplo">Exemplo: 26</div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="complemento">Complemento (opcional):</label>
                        <input type="text" id="complemento" placeholder="Apto, Bloco, Casa, etc.">
                    </div>
                    
                    <button onclick="consultarPorCEP()">🔍 Buscar Endereço</button>
                    
                    <div id="resultadoCep"></div>
                </div>

                <!-- TAB 2: Busca por Endereço -->
                <div id="tabEndereco" class="tab-content hidden">
                    <div class="form-group">
                        <label for="enderecoCompleto">Digite o endereço completo:</label>
                        <textarea id="enderecoCompleto" rows="3" placeholder="Exemplo: Rua Onofra Aurelina da Silva, 26 - Jardim Imperial, Lagoa Santa - MG, 33234-166"></textarea>
                        <div class="exemplo">Cole ou digite o endereço completo no formato: Rua, Número - Bairro, Cidade - UF, CEP</div>
                    </div>
                    
                    <button onclick="processarEndereco()">🔍 Processar Endereço</button>
                    
                    <div id="resultadoEndereco"></div>
                </div>

                <!-- TAB 3: Cálculo de Rota -->
                <div id="tabRota" class="tab-content hidden">
                    <div class="form-group">
                        <label for="origem">Origem:</label>
                        <input type="text" id="origem" placeholder="Digite o endereço de origem">
                        <div id="resultadosOrigem" class="search-results hidden"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="destino">Destino:</label>
                        <input type="text" id="destino" placeholder="Digite o endereço de destino">
                        <div id="resultadosDestino" class="search-results hidden"></div>
                    </div>
                    
                    <button onclick="calcularRota()" class="route-btn">🚗 Calcular Rota</button>
                    <button onclick="limparRota()" class="clear-btn">🗑️ Limpar Rota</button>
                    
                    <div id="infoRota" class="route-info hidden">
                        <div class="route-item">
                            <strong>Distância:</strong> <span id="distancia">-</span>
                        </div>
                        <div class="route-item">
                            <strong>Duração:</strong> <span id="duracao">-</span>
                        </div>
                        <div class="route-item">
                            <strong>Origem:</strong> <span id="origemInfo">-</span>
                        </div>
                        <div class="route-item">
                            <strong>Destino:</strong> <span id="destinoInfo">-</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="map-container">
                <div id="map"></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Variáveis globais
        let map;
        let markers = [];
        let routeLayer = null;
        let origemMarker = null;
        let destinoMarker = null;
        let origemCoords = null;
        let destinoCoords = null;

        // Inicialização do mapa
        function initMap() {
            // Coordenadas iniciais (centro do Brasil)
            const initialCoords = [-14.2350, -51.9253];
            
            // Criar mapa
            map = L.map('map').setView(initialCoords, 5);
            
            // Adicionar camada do OpenStreetMap
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);
            
            // Adicionar evento de clique no mapa
            map.on('click', function(e) {
                // Adicionar marcador no local clicado
                addMarker(e.latlng, 'Localização selecionada');
            });
            
            console.log("Mapa inicializado");
        }

        // Adicionar marcador no mapa
        function addMarker(coords, title, isRoutePoint = false) {
            // Remover marcadores anteriores se for ponto de rota
            if (isRoutePoint) {
                if (title.includes('Origem')) {
                    if (origemMarker) map.removeLayer(origemMarker);
                } else if (title.includes('Destino')) {
                    if (destinoMarker) map.removeLayer(destinoMarker);
                }
            }
            
            // Criar ícone personalizado
            const iconColor = isRoutePoint ? 
                (title.includes('Origem') ? 'green' : 'red') : 'blue';
                
            const customIcon = L.divIcon({
                className: 'custom-marker',
                html: `<div style="background-color: ${iconColor}; width: 12px; height: 12px; border-radius: 50%; border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.3);"></div>`,
                iconSize: [16, 16],
                iconAnchor: [8, 8]
            });
            
            // Adicionar marcador
            const marker = L.marker(coords, { icon: customIcon }).addTo(map);
            
            // Adicionar popup
            marker.bindPopup(`
                <div class="marker-info">
                    <div class="marker-title">${title}</div>
                    <div class="coordinates">Lat: ${coords.lat.toFixed(6)}, Lng: ${coords.lng.toFixed(6)}</div>
                </div>
            `);
            
            // Salvar referência
            markers.push(marker);
            
            // Salvar referências específicas para origem e destino
            if (isRoutePoint) {
                if (title.includes('Origem')) {
                    origemMarker = marker;
                    origemCoords = coords;
                } else if (title.includes('Destino')) {
                    destinoMarker = marker;
                    destinoCoords = coords;
                }
            }
            
            // Centralizar mapa no marcador
            map.setView(coords, 13);
            
            return marker;
        }

        // Limpar todos os marcadores
        function clearMarkers() {
            markers.forEach(marker => map.removeLayer(marker));
            markers = [];
            origemMarker = null;
            destinoMarker = null;
            origemCoords = null;
            destinoCoords = null;
            
            // Limpar rota
            if (routeLayer) {
                map.removeLayer(routeLayer);
                routeLayer = null;
            }
            
            // Limpar informações de rota
            document.getElementById('infoRota').classList.add('hidden');
        }

        // Calcular e exibir rota
        function calcularRota() {
            if (!origemCoords || !destinoCoords) {
                alert('Por favor, selecione origem e destino no mapa');
                return;
            }
            
            // Limpar rota anterior
            if (routeLayer) {
                map.removeLayer(routeLayer);
            }
            
            // Usar OSRM para calcular rota
            const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${origemCoords.lng},${origemCoords.lat};${destinoCoords.lng},${destinoCoords.lat}?overview=full&geometries=geojson`;
            
            fetch(osrmUrl)
                .then(response => response.json())
                .then(data => {
                    if (data.code !== 'Ok') {
                        throw new Error('Não foi possível calcular a rota');
                    }
                    
                    // Extrair geometria da rota
                    const routeGeometry = data.routes[0].geometry;
                    
                    // Criar camada da rota
                    routeLayer = L.geoJSON(routeGeometry, {
                        style: {
                            color: '#3498db',
                            weight: 5,
                            opacity: 0.7
                        }
                    }).addTo(map);
                    
                    // Ajustar visualização para mostrar toda a rota
                    const bounds = routeLayer.getBounds();
                    map.fitBounds(bounds, { padding: [20, 20] });
                    
                    // Exibir informações da rota
                    const distancia = (data.routes[0].distance / 1000).toFixed(1);
                    const duracao = (data.routes[0].duration / 60).toFixed(0);
                    
                    document.getElementById('distancia').textContent = `${distancia} km`;
                    document.getElementById('duracao').textContent = `${duracao} minutos`;
                    document.getElementById('origemInfo').textContent = `Lat: ${origemCoords.lat.toFixed(4)}, Lng: ${origemCoords.lng.toFixed(4)}`;
                    document.getElementById('destinoInfo').textContent = `Lat: ${destinoCoords.lat.toFixed(4)}, Lng: ${destinoCoords.lng.toFixed(4)}`;
                    document.getElementById('infoRota').classList.remove('hidden');
                })
                .catch(error => {
                    console.error('Erro ao calcular rota:', error);
                    alert('Erro ao calcular rota: ' + error.message);
                });
        }

        // Limpar rota
        function limparRota() {
            clearMarkers();
        }

        // Controle das abas
        function openTab(tabName) {
            // Esconde todas as tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.add('hidden');
            });
            
            // Remove classe active de todos os botões
            document.querySelectorAll('.tab-button').forEach(button => {
                button.classList.remove('active');
            });
            
            // Mostra a tab selecionada e ativa o botão
            document.getElementById(tabName).classList.remove('hidden');
            event.currentTarget.classList.add('active');
            
            // Limpa resultados
            document.getElementById('resultadoCep').innerHTML = '';
            document.getElementById('resultadoEndereco').innerHTML = '';
        }

        // Máscara para o CEP
        document.getElementById('cep').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 5) {
                value = value.substring(0,5) + '-' + value.substring(5,8);
            }
            e.target.value = value;
        });

        // Busca por CEP
        async function consultarPorCEP() {
            const cep = document.getElementById('cep').value.replace(/\D/g, '');
            const numero = document.getElementById('numero').value.trim();
            const complemento = document.getElementById('complemento').value.trim();
            const resultado = document.getElementById('resultadoCep');
            
            resultado.innerHTML = '';
            resultado.className = '';
            
            // Validações
            if (cep.length !== 8) {
                mostrarErro(resultado, '❌ CEP deve conter 8 dígitos');
                return;
            }
            
            if (!numero) {
                mostrarErro(resultado, '❌ Por favor, informe o número da casa');
                return;
            }
            
            try {
                resultado.innerHTML = '<div class="loading">🔍 Buscando endereço...</div>';
                
                const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                const dados = await response.json();
                
                if (dados.erro) {
                    mostrarErro(resultado, '❌ CEP não encontrado');
                    return;
                }
                
                // Monta o endereço completo
                let enderecoCompleto = `${dados.logradouro}, ${numero}`;
                if (complemento) {
                    enderecoCompleto += ` - ${complemento}`;
                }
                enderecoCompleto += ` - ${dados.bairro}, ${dados.localidade} - ${dados.uf}, ${dados.cep}`;
                
                // Exibe os resultados
                resultado.innerHTML = `
                    <div class="endereco-completo">${enderecoCompleto}</div>
                    
                    <div style="margin-top: 15px;">
                        <div class="endereco-item"><strong>📝 Logradouro:</strong> ${dados.logradouro}</div>
                        <div class="endereco-item"><strong>🏠 Número:</strong> ${numero}</div>
                        ${complemento ? `<div class="endereco-item"><strong>🔧 Complemento:</strong> ${complemento}</div>` : ''}
                        <div class="endereco-item"><strong>🏘️ Bairro:</strong> ${dados.bairro}</div>
                        <div class="endereco-item"><strong>🏙️ Cidade:</strong> ${dados.localidade}</div>
                        <div class="endereco-item"><strong>🗺️ Estado:</strong> ${dados.uf}</div>
                        <div class="endereco-item"><strong>📮 CEP:</strong> ${dados.cep}</div>
                    </div>
                    <button class="copy-btn" onclick="copiarEndereco('${enderecoCompleto}')">📋 Copiar Endereço</button>
                    <button class="route-btn" onclick="adicionarAoMapa('${dados.logradouro}, ${numero} - ${dados.bairro}, ${dados.localidade} - ${dados.uf}')">📍 Adicionar ao Mapa</button>
                `;
                
            } catch (error) {
                mostrarErro(resultado, '❌ Erro ao consultar o CEP. Tente novamente.');
            }
        }

        // Processa endereço digitado
        function processarEndereco() {
            const enderecoTexto = document.getElementById('enderecoCompleto').value.trim();
            const resultado = document.getElementById('resultadoEndereco');
            
            resultado.innerHTML = '';
            resultado.className = '';
            
            if (!enderecoTexto) {
                mostrarErro(resultado, '❌ Por favor, digite um endereço');
                return;
            }
            
            try {
                // Tenta extrair informações do endereço
                const info = extrairInformacoesEndereco(enderecoTexto);
                
                resultado.innerHTML = `
                    <div class="endereco-completo">${info.enderecoFormatado}</div>
                    
                    <div style="margin-top: 15px;">
                        <div class="endereco-item"><strong>📝 Logradouro:</strong> ${info.logradouro}</div>
                        <div class="endereco-item"><strong>🏠 Número:</strong> ${info.numero}</div>
                        ${info.complemento ? `<div class="endereco-item"><strong>🔧 Complemento:</strong> ${info.complemento}</div>` : ''}
                        <div class="endereco-item"><strong>🏘️ Bairro:</strong> ${info.bairro}</div>
                        <div class="endereco-item"><strong>🏙️ Cidade:</strong> ${info.cidade}</div>
                        <div class="endereco-item"><strong>🗺️ Estado:</strong> ${info.estado}</div>
                        <div class="endereco-item"><strong>📮 CEP:</strong> ${info.cep}</div>
                    </div>
                    <button class="copy-btn" onclick="copiarEndereco('${info.enderecoFormatado}')">📋 Copiar Endereço</button>
                    <button class="route-btn" onclick="adicionarAoMapa('${info.enderecoFormatado}')">📍 Adicionar ao Mapa</button>
                `;
                
            } catch (error) {
                mostrarErro(resultado, '❌ Não foi possível processar o endereço. Verifique o formato.');
            }
        }

        // Função para extrair informações do endereço
        function extrairInformacoesEndereco(endereco) {
            // Padrões regex para extrair informações
            const padraoCompleto = /(.+),\s*(\d+)\s*(?:-?\s*(.+?))?\s*-\s*(.+?)\s*,\s*(.+?)\s*-\s*([A-Z]{2})\s*,\s*(\d{5}-\d{3})/;
            const match = endereco.match(padraoCompleto);
            
            if (!match) {
                throw new Error('Formato de endereço não reconhecido');
            }
            
            return {
                logradouro: match[1].trim(),
                numero: match[2].trim(),
                complemento: match[3] ? match[3].trim() : '',
                bairro: match[4].trim(),
                cidade: match[5].trim(),
                estado: match[6].trim(),
                cep: match[7].trim(),
                enderecoFormatado: endereco
            };
        }

        // Adicionar endereço ao mapa
        async function adicionarAoMapa(endereco) {
            try {
                // Usar Nominatim para geocodificação
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(endereco)}&limit=1`);
                const data = await response.json();
                
                if (data.length === 0) {
                    alert('Endereço não encontrado no mapa');
                    return;
                }
                
                const coords = {
                    lat: parseFloat(data[0].lat),
                    lng: parseFloat(data[0].lon)
                };
                
                // Adicionar marcador
                addMarker(coords, endereco);
                
            } catch (error) {
                console.error('Erro ao geocodificar endereço:', error);
                alert('Erro ao adicionar endereço ao mapa');
            }
        }

        // Função para copiar endereço
        function copiarEndereco(texto) {
            navigator.clipboard.writeText(texto).then(() => {
                alert('✅ Endereço copiado para a área de transferência!');
            });
        }

        // Função para mostrar erro
        function mostrarErro(elemento, mensagem) {
            elemento.innerHTML = mensagem;
            elemento.classList.add('erro');
        }

        // Busca de endereços para autocompletar
        function buscarEnderecosAutocomplete(inputElement, resultadosElement) {
            const query = inputElement.value.trim();
            
            if (query.length < 3) {
                resultadosElement.classList.add('hidden');
                return;
            }
            
            // Usar Nominatim para busca
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5`)
                .then(response => response.json())
                .then(data => {
                    resultadosElement.innerHTML = '';
                    
                    if (data.length === 0) {
                        resultadosElement.classList.add('hidden');
                        return;
                    }
                    
                    data.forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'search-result-item';
                        div.innerHTML = `
                            <div class="search-result-title">${item.display_name.split(',')[0]}</div>
                            <div class="search-result-details">${item.display_name}</div>
                        `;
                        
                        div.addEventListener('click', () => {
                            inputElement.value = item.display_name;
                            resultadosElement.classList.add('hidden');
                            
                            // Adicionar marcador no mapa
                            const coords = {
                                lat: parseFloat(item.lat),
                                lng: parseFloat(item.lon)
                            };
                            
                            const markerTitle = inputElement.id === 'origem' ? 'Origem da rota' : 'Destino da rota';
                            addMarker(coords, markerTitle, true);
                        });
                        
                        resultadosElement.appendChild(div);
                    });
                    
                    resultadosElement.classList.remove('hidden');
                })
                .catch(error => {
                    console.error('Erro na busca de endereços:', error);
                    resultadosElement.classList.add('hidden');
                });
        }

        // Event listeners para autocompletar
        document.getElementById('origem').addEventListener('input', function() {
            buscarEnderecosAutocomplete(this, document.getElementById('resultadosOrigem'));
        });
        
        document.getElementById('destino').addEventListener('input', function() {
            buscarEnderecosAutocomplete(this, document.getElementById('resultadosDestino'));
        });

        // Enter para buscar
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const tabAtiva = document.querySelector('.tab-button.active').textContent;
                if (tabAtiva.includes('CEP')) {
                    consultarPorCEP();
                } else if (tabAtiva.includes('Endereço')) {
                    processarEndereco();
                } else if (tabAtiva.includes('Rota')) {
                    calcularRota();
                }
            }
        });

        // Exemplo pré-preenchido na segunda aba
        document.getElementById('enderecoCompleto').value = 'Rua Onofra Aurelina da Silva, 26 - Jardim Imperial, Lagoa Santa - MG, 33234-166';

        // Inicializar mapa quando a página carregar
        window.onload = function() {
            initMap();
        };
    </script>
</body>
</html>
